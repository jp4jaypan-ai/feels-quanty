<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='760' viewBox='0 0 1600 760' role='img' aria-labelledby='title desc'>
  <title id='title'>feels-quanty — Intraday Signal Intelligence</title>
  <desc id='desc'>发布会风格的 feels-quanty 主视觉，展示低位买入、高位卖出、MACD 背离与本地实时提醒</desc>
  <defs>
    <linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'>
      <stop offset='0' stop-color='#05060A'/>
      <stop offset='0.48' stop-color='#090B13'/>
      <stop offset='1' stop-color='#040507'/>
    </linearGradient>
    <radialGradient id='violetHalo' cx='50%' cy='20%' r='70%'>
      <stop offset='0' stop-color='#7C65FF' stop-opacity='0.34'/>
      <stop offset='0.45' stop-color='#4932D5' stop-opacity='0.10'/>
      <stop offset='1' stop-color='#090B13' stop-opacity='0'/>
    </radialGradient>
    <radialGradient id='blueHalo' cx='50%' cy='50%' r='50%'>
      <stop offset='0' stop-color='#55D7FF' stop-opacity='0.28'/>
      <stop offset='1' stop-color='#55D7FF' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='titleGradient' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#FFFFFF'/>
      <stop offset='0.55' stop-color='#F1EEFF'/>
      <stop offset='1' stop-color='#B9B0FF'/>
    </linearGradient>
    <linearGradient id='lineGradient' x1='0' y1='0' x2='1' y2='0'>
      <stop offset='0' stop-color='#5D67FF' stop-opacity='0'/>
      <stop offset='0.18' stop-color='#7772FF'/>
      <stop offset='0.52' stop-color='#C187FF'/>
      <stop offset='0.82' stop-color='#49D8FF'/>
      <stop offset='1' stop-color='#49D8FF' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='beam' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#A997FF' stop-opacity='0.20'/>
      <stop offset='1' stop-color='#A997FF' stop-opacity='0'/>
    </linearGradient>
    <linearGradient id='stage' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0' stop-color='#FFFFFF' stop-opacity='0.10'/>
      <stop offset='1' stop-color='#FFFFFF' stop-opacity='0'/>
    </linearGradient>
    <pattern id='floorGrid' width='80' height='42' patternUnits='userSpaceOnUse'>
      <path d='M80 0H0V42' fill='none' stroke='#A99DFF' stroke-opacity='0.08' stroke-width='1'/>
    </pattern>
    <filter id='softGlow' x='-100%' y='-100%' width='300%' height='300%'>
      <feGaussianBlur stdDeviation='18'/>
    </filter>
    <filter id='lineGlow' x='-20%' y='-100%' width='140%' height='300%'>
      <feGaussianBlur stdDeviation='7' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='logoShadow' x='-80%' y='-80%' width='260%' height='260%'>
      <feDropShadow dx='0' dy='10' stdDeviation='14' flood-color='#7667FF' flood-opacity='0.45'/>
    </filter>
    <clipPath id='frame'><rect width='1600' height='760' rx='32'/></clipPath>
  </defs>

  <g clip-path='url(#frame)'>
    <rect width='1600' height='760' fill='url(#bg)'/>
    <rect width='1600' height='760' fill='url(#violetHalo)'/>
    <ellipse cx='1310' cy='280' rx='430' ry='380' fill='url(#blueHalo)' opacity='0.46'/>
    <ellipse cx='270' cy='315' rx='420' ry='390' fill='url(#violetHalo)' opacity='0.34'/>

    <path d='M505 -40L712 620H320Z' fill='url(#beam)' opacity='0.50'/>
    <path d='M1090 -80L1285 620H870Z' fill='url(#beam)' opacity='0.24'/>
    <path d='M785 -100L930 620H645Z' fill='url(#beam)' opacity='0.18'/>

    <g opacity='0.60'>
      <circle cx='800' cy='418' r='162' fill='none' stroke='#8B7DFF' stroke-opacity='0.10'/>
      <circle cx='800' cy='418' r='214' fill='none' stroke='#8B7DFF' stroke-opacity='0.07'/>
      <circle cx='800' cy='418' r='270' fill='none' stroke='#8B7DFF' stroke-opacity='0.045'/>
    </g>

    <ellipse cx='800' cy='690' rx='670' ry='178' fill='url(#stage)' opacity='0.48'/>
    <path d='M0 592H1600V760H0Z' fill='url(#floorGrid)' opacity='0.55'/>
    <path d='M0 592H1600' stroke='#FFFFFF' stroke-opacity='0.08'/>

    <g transform='translate(64 52)' font-family='Inter, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif'>
      <g filter='url(#logoShadow)'>
        <rect width='48' height='48' rx='15' fill='#F4F2FF'/>
        <circle cx='24' cy='24' r='10' fill='none' stroke='#0A0B11' stroke-width='4'/>
        <path d='M31 31L37 37' stroke='#0A0B11' stroke-width='4' stroke-linecap='round'/>
      </g>
      <text x='68' y='32' fill='#F7F5FF' font-size='25' font-weight='650' letter-spacing='-0.5'>feels-quanty</text>
    </g>

    <g transform='translate(1536 66)' text-anchor='end' font-family='Inter, Segoe UI, sans-serif'>
      <text y='0' fill='#F3F1FF' font-size='12' font-weight='700' letter-spacing='2.8'>SIGNAL INTELLIGENCE</text>
      <text y='25' fill='#89869B' font-size='11' letter-spacing='1.6'>LOCAL EDITION</text>
    </g>

    <g text-anchor='middle' font-family='Inter, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif'>
      <g transform='translate(800 172)'>
        <rect x='-138' y='-20' width='276' height='40' rx='20' fill='#FFFFFF' fill-opacity='0.055' stroke='#FFFFFF' stroke-opacity='0.13'/>
        <circle cx='-109' cy='0' r='4' fill='#6EE7C2'/>
        <text x='12' y='5' fill='#C7C3D7' font-size='12' font-weight='650' letter-spacing='2.1'>INTRADAY SIGNAL ENGINE</text>
      </g>

      <text x='800' y='303' fill='url(#titleGradient)' font-size='112' font-weight='740' letter-spacing='-5'>feels-quanty</text>
      <text x='800' y='358' fill='#B1ADBF' font-size='24' font-weight='420' letter-spacing='1'>看见转折，把决定留给你</text>
      <text x='800' y='402' fill='#777486' font-size='15' letter-spacing='2.4'>分时顶底  ×  MACD 背离  ×  WINDPY 实时量价</text>
    </g>

    <g filter='url(#lineGlow)'>
      <path d='M75 512C140 500 185 468 248 476C318 484 365 548 455 558C538 568 604 512 675 496C748 480 795 525 868 502C942 479 998 418 1085 410C1170 402 1214 470 1292 472C1370 474 1430 430 1525 422' fill='none' stroke='url(#lineGradient)' stroke-width='4' stroke-linecap='round'/>
    </g>

    <path d='M485 548C655 520 880 432 1055 416' fill='none' stroke='#D7D0FF' stroke-opacity='0.22' stroke-width='2' stroke-dasharray='6 11'/>

    <g font-family='Inter, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif'>
      <g transform='translate(1085 410)'>
        <circle r='18' fill='#FF6680' fill-opacity='0.16' filter='url(#softGlow)'/>
        <circle r='7' fill='#0A0B11' stroke='#FF7890' stroke-width='3'/>
        <path d='M0 -19V-10M-5 -15L0 -10L5 -15' fill='none' stroke='#FF7890' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
        <text x='0' y='-34' text-anchor='middle' fill='#FF92A3' font-size='12' font-weight='700' letter-spacing='1'>高位 SELL</text>
      </g>
      <g transform='translate(455 558)'>
        <circle r='18' fill='#59E0BE' fill-opacity='0.15' filter='url(#softGlow)'/>
        <circle r='7' fill='#0A0B11' stroke='#65E1C1' stroke-width='3'/>
        <path d='M0 19V10M-5 15L0 10L5 15' fill='none' stroke='#65E1C1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/>
        <text x='0' y='38' text-anchor='middle' fill='#7DE7CC' font-size='12' font-weight='700' letter-spacing='1'>低位 BUY</text>
      </g>
    </g>

    <g transform='translate(800 665)' text-anchor='middle' font-family='Inter, Segoe UI, sans-serif'>
      <g transform='translate(-230 0)'>
        <circle cx='-53' cy='-4' r='3' fill='#6EE7C2'/>
        <text y='0' fill='#ABA7B8' font-size='11' font-weight='650' letter-spacing='1.8'>WINDPY LIVE</text>
      </g>
      <g>
        <circle cx='-64' cy='-4' r='3' fill='#9F91FF'/>
        <text y='0' fill='#ABA7B8' font-size='11' font-weight='650' letter-spacing='1.8'>LOCAL-FIRST</text>
      </g>
      <g transform='translate(230 0)'>
        <circle cx='-62' cy='-4' r='3' fill='#FF879B'/>
        <text y='0' fill='#ABA7B8' font-size='11' font-weight='650' letter-spacing='1.8'>SIGNAL ONLY</text>
      </g>
    </g>

    <rect x='0.5' y='0.5' width='1599' height='759' rx='31.5' fill='none' stroke='#FFFFFF' stroke-opacity='0.10'/>
  </g>
</svg>
